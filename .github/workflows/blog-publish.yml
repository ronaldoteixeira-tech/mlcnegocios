name: Validar e gerar blog

on:
  push:
    branches:
      - main
      - cms-mvp-v2
    paths:
      - ".pages.yml"
      - ".github/workflows/blog-publish.yml"
      - "assets/img/**"
      - "noticias/posts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      payload:
        description: Contexto opcional de uma execução manual
        required: false
        default: "{}"
        type: string

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testar ciclo editorial, gerar e validar o blog
        run: npm run test:mvp

      - name: Registrar páginas geradas
        shell: bash
        run: |
          git add -A -- noticias
          if git diff --cached --quiet; then
            echo "Nenhuma página gerada foi alterada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(blog): atualizar páginas geradas"
          git push

      - name: Definir endereço publicado
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "SITE_URL=https://mlcnegocios.com.br" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${GITHUB_REF_NAME}.mlcnegocios.pages.dev" >> "$GITHUB_ENV"
          fi

      - name: Confirmar páginas no Cloudflare
        env:
          VERIFY_RETRIES: "24"
          VERIFY_INTERVAL_MS: "10000"
        run: npm run blog:validate:production
