name: Validar e gerar blog

on:
  push:
    branches:
      - main
      - teste-painel-mvp
    paths:
      - ".pages.yml"
      - ".github/workflows/blog-publish.yml"
      - "assets/img/**"
      - "noticias/posts/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      payload:
        description: Contexto opcional de uma execução manual
        required: false
        default: "{}"
        type: string

concurrency:
  group: blog-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar páginas do blog
        run: npm run blog:build

      - name: Validar conteúdo e saída
        run: npm run blog:validate

      - name: Registrar páginas geradas
        shell: bash
        run: |
          git add -A -- noticias
          if git diff --cached --quiet; then
            echo "Nenhuma página gerada foi alterada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(blog): atualizar páginas geradas [skip ci]"
          git push
